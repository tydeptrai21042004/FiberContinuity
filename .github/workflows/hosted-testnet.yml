name: FiberContinuity cloud verification
on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: '25 4 * * 1'
permissions:
  contents: read
concurrency:
  group: fiber-evidence-${{ github.ref }}
  cancel-in-progress: false
jobs:
  unit-and-build:
    name: unit-and-build (Node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # This project ZIP does not include an npm lockfile.
      # Cache only npm's download cache; do not ask setup-node to look for a missing lockfile.
      - name: Cache npm downloads
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ matrix.node }}-${{ hashFiles('package.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-${{ matrix.node }}-
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck, unit tests and production build
        run: npm run check && npm run build && npm run test:hosted-api

  real-browser-testnet:
    name: Hosted disposable Fiber testnet (Node 22)
    needs: unit-and-build
    # Avoid calling real testnet when local checks already fail.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # This project ZIP does not include an npm lockfile.
      # Cache only npm's download cache; do not ask setup-node to look for a missing lockfile.
      - name: Cache npm downloads
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-22-${{ hashFiles('package.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-22-
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install chromium --with-deps
      - name: Run actual zero-channel test; never treat missing WASM startup as PASS
        env:
          FIBER_CONTINUITY_URL: ${{ vars.FIBER_CONTINUITY_URL || 'https://fiber-continuity.vercel.app' }}
          EVIDENCE_INGEST_TOKEN: ${{ secrets.EVIDENCE_INGEST_TOKEN }}
        run: npm run test:hosted-browser
      - name: Preserve redacted evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fiber-testnet-evidence-${{ github.run_id }}
          path: evidence/hosted-browser-evidence.json
          if-no-files-found: warn
          retention-days: 30
