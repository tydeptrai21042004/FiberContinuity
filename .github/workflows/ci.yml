name: FiberContinuity checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit-and-build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # This project ZIP does not include an npm lockfile.
      # Cache only npm's download cache; do not ask setup-node to look for a missing lockfile.
      - name: Cache npm downloads
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ matrix.node }}-${{ hashFiles('package.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-${{ matrix.node }}-
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: TypeScript and unit tests
        run: npm run check
      - name: Hosted API tests
        run: npm run test:hosted-api
      - name: Production build
        run: npm run build
      - name: Verify no tracked recovery secrets
        run: |
          if find . -path './node_modules' -prune -o -type f \
            \( -name '*.fcr.json' -o -name '.env.local' -o -name '*private-key*' \) -print | grep -q .; then
            echo 'Sensitive backup/credential-like files found.'
            exit 1
          fi
